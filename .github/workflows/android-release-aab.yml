name: Build Razor City Play Internal Test AAB
# Internal testing bundles use Google test ads.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-aab.yml'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web game
        run: npm run build

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore Play upload key
        env:
          RAZOR_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RAZOR_UPLOAD_KEYSTORE_BASE64 }}
          RAZOR_UPLOAD_PASSWORD: ${{ secrets.RAZOR_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$RAZOR_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$RAZOR_UPLOAD_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Add RAZOR_UPLOAD_KEYSTORE_BASE64 and RAZOR_UPLOAD_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$RAZOR_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/razor-city-upload.jks"
          keytool -list             -keystore "$RUNNER_TEMP/razor-city-upload.jks"             -storepass "$RAZOR_UPLOAD_PASSWORD"             -alias razorcityupload >/dev/null

      - name: Build signed internal-test AAB
        working-directory: android
        env:
          RAZOR_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/razor-city-upload.jks
          RAZOR_UPLOAD_PASSWORD: ${{ secrets.RAZOR_UPLOAD_PASSWORD }}
        run: ./gradlew bundleRelease -PuseLiveAds=false

      - name: Verify AAB signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Razor-City-Internal-Test-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
